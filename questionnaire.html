<!DOCTYPE html>
<html lang="fr-CA">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Parle-nous de ton projet et reçois ton plan d'affaires complet généré par IA. Bildop.">
  <title>Bildop — Parle-nous de ton projet</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navigation -->
  <nav class="nav" id="nav">
    <div class="nav__inner">
      <a href="index.html" class="nav__logo"><span style="color:var(--sky)">bild</span><span style="color:var(--navy)">op</span></a>
      <ul class="nav__links" id="navLinks">
        <li><a href="index.html">← Retour au site</a></li>
        <li><a href="#" id="btnSave" style="color: #00c1ff; font-weight: 600;">Sauvegarder</a></li>
        <li><a href="#" id="btnMyPlans" style="color: #764ba2; font-weight: 600;">Mes plans</a></li>
        <li><a href="#" id="btnReset" style="color: #ff4757; font-weight: 600;">Nouveau plan</a></li>
      </ul>

      <!-- Plans Modal -->
      <div id="plansModal" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.5); z-index:9999; justify-content:center; align-items:center;">
        <div style="background:white; border-radius:16px; padding:32px; max-width:500px; width:90%; max-height:80vh; overflow-y:auto; position:relative;">
          <button id="closeModal" style="position:absolute; top:12px; right:16px; background:none; border:none; font-size:1.5rem; cursor:pointer;">&times;</button>
          <h2 style="margin-bottom:8px; font-size:1.3rem;">Mes plans d'affaires</h2>
          <p style="color:#666; font-size:0.85rem; margin-bottom:20px;">Phase test — sauvegarde illimitee</p>
          <div id="plansList"></div>
        </div>
      </div>
      <button class="nav__toggle" id="navToggle" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <!-- Questionnaire -->
  <div class="questionnaire">
    <div class="questionnaire__container">

      <!-- Progress -->
      <div class="progress-bar">
        <div class="progress-bar__fill" id="progressFill" style="width: 0%"></div>
      </div>
      <div class="progress-info">
        <span><strong id="categoryName">Informations générales</strong></span>
        <span id="questionProgress">Étape 1 de 9</span>
      </div>

      <!-- Category Steps -->
      <div class="category-stepper" id="categoryStepper">
        <!-- Generated by JS -->
      </div>

      <!-- Question Card -->
      <div class="question-card" id="questionCard">
        <!-- Dynamically rendered -->
      </div>

      <!-- Navigation -->
      <div class="question-nav">
        <button class="btn btn--secondary" id="btnPrev" disabled>← Précédent</button>
        <button class="btn btn--primary" id="btnNext">Suivant →</button>
      </div>

    </div>
  </div>

  <script src="js/questionnaire.js"></script>
</body>
</html>
